{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NIGHT CITY AUTOSALON{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'autosalon/style.css' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;900&family=Roboto+Mono:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <script src="{% static 'app.js' %}"></script>
    <script src="{% static 'autosalon/js/htmx.min.js' %}"></script>
    <script src="{% static 'autosalon/js/json-enc.js' %}"></script>
    {% block extra_head %}{% endblock %}
</head>
<body>
<header class="hud-header">
    <div class="hud-logo">NIGHT CITY AUTOSALON</div>
    <nav class="hud-nav">
        <a href="{% url 'catalog_page' %}" class="hud-btn">Каталог</a>
        <a href="/admin/" class="hud-btn hud-btn-danger">Админка</a>
    </nav>
</header>
<main class="hud-main">{% block content %}{% endblock %}</main>

<!-- МОДАЛЬНОЕ ОКНО -->
<div id="test-drive-modal" class="hud-modal-overlay" style="display: none;">
    <div class="hud-modal">
        <div class="hud-panel-title" style="justify-content: space-between;">
            <span>Запись на тест-драйв</span>
            <button type="button" id="close-modal-btn" class="hud-btn hud-btn-danger" style="padding: 4px 12px; font-size: 12px;">X</button>
        </div>
        <form id="test-drive-form">
            <input type="hidden" id="td-car-id" name="car">
            <div class="hud-field">
                <label class="hud-label">Автомобиль</label>
                <div id="td-car-name" style="color: var(--neon-cyan); font-weight: bold; margin-bottom: 10px;"></div>
            </div>
            <div class="hud-field"><label class="hud-label" for="td-name">Имя</label><input class="hud-input" type="text" id="td-name" name="client_name" required></div>
            <div class="hud-field"><label class="hud-label" for="td-phone">Телефон</label><input class="hud-input" type="text" id="td-phone" name="client_phone" required></div>
            <div class="hud-field"><label class="hud-label" for="td-date">Дата и время</label><input class="hud-input" type="datetime-local" id="td-date" name="date_time" required style="color-scheme: dark;"></div>
            <button type="submit" class="hud-btn" style="width: 100%; margin-top: 10px;">Записаться</button>
        </form>
        <div id="td-feedback" style="margin-top: 15px;"></div>
    </div>
</div>
<script src="{% static 'autosalon/js/app.js' %}"></script>
</body>
</html>
